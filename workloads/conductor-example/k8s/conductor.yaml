apiVersion: v1
kind: Namespace
metadata:
  name: conductor
---
# Server and UI in one container on SQLite, which needs no other service. A demo setup: use your
# own Conductor deployment in production. The server holds no identity, so it gets no Workload API socket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  namespace: conductor
spec:
  replicas: 1
  selector:
    matchLabels: {app: conductor}
  template:
    metadata:
      labels: {app: conductor}
    spec:
      containers:
        - name: conductor
          image: conductoross/conductor:3.32.5
          env:
            - {name: JAVA_OPTS, value: "-Xmx512m"}
          ports:
            - {name: api, containerPort: 8080}
            - {name: ui, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          resources:
            requests: {memory: 640Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: conductor
  namespace: conductor
spec:
  selector: {app: conductor}
  ports:
    - {name: api, port: 8080}
    - {name: ui, port: 5000}
